name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型 / Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - all
      create_release:
        description: '是否发布 GitHub Release'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Release 标签名 (手动发布 Release 时必填，如 v1.0.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build and Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
            echo "Keystore decoded successfully."
          else
            echo "No KEYSTORE_BASE64 secret provided. Skipping decode."
          fi

      - name: Build APK
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ -z "$BUILD_TYPE" ]; then
            BUILD_TYPE="release"
          fi

          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --stacktrace
          elif [ "$BUILD_TYPE" = "all" ]; then
            ./gradlew assemble --stacktrace
          else
            ./gradlew assembleRelease --stacktrace
          fi

      - name: Prepare Release Assets
        id: prepare_assets
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          mkdir -p release-assets
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-assets/claude-launcher-${TAG}.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release-assets/claude-launcher-${TAG}-unsigned.apk
          fi
          ls -lh release-assets/ || true

      - name: List Output APKs
        run: ls -lh app/build/outputs/apk/*/*.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claude-launcher-apk
          path: |
            app/build/outputs/apk/**/*.apk
            release-assets/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_assets.outputs.tag }}
          name: Release ${{ steps.prepare_assets.outputs.tag }}
          files: |
            release-assets/*.apk
          generate_release_notes: true
